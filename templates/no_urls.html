<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No URLs Configured</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: white;
        }

        .content-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .app-footer { border-top: 1px solid rgba(255,255,255,0.2); padding: 0.75rem 1rem; text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.7); }
        .footer-sep { margin: 0 0.5rem; opacity: 0.5; }
        .footer-link { color: rgba(255,255,255,0.9); }
        .footer-link:hover { text-decoration: underline; }
        .footer-disclaimer { font-style: italic; opacity: 0.7; }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px;
        }
        
        h1 {
            font-size: 72px;
            margin-bottom: 20px;
        }
        
        h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        
        p {
            font-size: 18px;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .subdomain {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin: 20px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
    <div class="container">
        <h1>📋</h1>
        <h2>No URLs Yet</h2>
        <div class="subdomain">{{ subdomain }}.bookmarks.dougshipe.com</div>
        <p>This subdomain exists but has no URLs configured. Add some URLs in the admin panel to get started.</p>
    </div>
    </div>

    <footer class="app-footer">
        &copy; 2026 Doug Shipe
        <span class="footer-sep">&bull;</span>
        <a href="https://siterequest.dougshipe.com/submit?url={{ request.url | urlencode }}" target="_blank" rel="noopener" class="footer-link">Request a feature / Report a bug</a>&nbsp;
        <span class="footer-disclaimer">Do not use this to report urgent technical issues, this is not checked daily.</span>
    </footer>
</body>
</html>
